[project]
name = "wildtracks"
version = "0.1.0"
description = "Real animal tracks -> narrated map videos"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "shapely",
]

[project.scripts]
wildtracks = "wildtracks.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wildtracks"]
